<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Success</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#181818;--accent:#43a047;}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);font-family:"Roboto",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;position:relative;overflow:hidden;}
  .backdrop{position:fixed;inset:-80px;z-index:0;background:radial-gradient(420px 320px at 90% 20%,rgba(200,208,214,.35),transparent 62%),radial-gradient(420px 360px at 96% 66%,rgba(150,168,172,.28),transparent 66%),linear-gradient(120deg,#0e0e0e 0%,#1c1c1c 45%,#262828 100%);filter:blur(24px);transform:scale(1.08);}
  .backdrop::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.52)}
  .center{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:24px;}
  /* دائرة الصح */
  .check-circle{width:100px;height:100px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;animation:pop .4s cubic-bezier(.36,.07,.19,.97);}
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
  .check-circle svg{width:54px;height:54px;fill:#fff;}
  .title{color:#fff;font-size:26px;font-weight:700;margin-top:8px;}
  .subtitle{color:rgba(255,255,255,.6);font-size:14px;font-weight:300;max-width:280px;}
  .user-badge{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:30px;padding:8px 22px;color:rgba(255,255,255,.8);font-size:14px;margin-top:8px;}
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="center">
    <div class="check-circle">
      <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
    </div>
    <div class="title">Login Successful</div>
    <div class="subtitle">You have been authenticated successfully</div>
    <div class="user-badge" id="userBadge">Welcome!</div>
  </div>
<script>
  try{
    const login=localStorage.getItem('bna_login')||'User';
    document.getElementById('userBadge').textContent='Welcome, '+login;
    // تنظيف localStorage بعد النجاح
    localStorage.setItem('bna_status','done');
  }catch(e){}
</script>
</body>
</html>
