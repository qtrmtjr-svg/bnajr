<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الإدارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9;--s:#fff;--s2:#f0f2f5;
  --b:#e0e4ea;--b2:#d0d5de;
  --t:#1a1d27;--t2:#6b7280;
  --accent:#43a047;--ah:#388e3c;
  --danger:#e53935;--blue:#1976d2;
  --r:12px;--sha:0 4px 20px rgba(0,0,0,.08);--sh2:0 2px 8px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:"Cairo",system-ui,sans-serif;color:var(--t);min-height:100vh;direction:rtl;}

/* LOCK */
#lock{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;}
.lbox{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:44px 36px;width:100%;max-width:380px;box-shadow:var(--sha);text-align:center;}
.lico{font-size:52px;margin-bottom:16px}
.lbox h2{font-size:22px;font-weight:700;margin-bottom:6px}
.lbox p{font-size:13px;color:var(--t2);margin-bottom:28px}
.linp{width:100%;background:var(--s2);border:1.5px solid var(--b);border-radius:8px;padding:12px 16px;color:var(--t);font-family:"Cairo",sans-serif;font-size:16px;outline:none;direction:ltr;text-align:left;transition:border .2s;}
.linp:focus{border-color:var(--accent)}
.lerr{min-height:20px;font-size:13px;color:var(--danger);margin:10px 0}
.lbtn{width:100%;background:var(--accent);border:0;border-radius:8px;color:#fff;font-family:"Cairo",sans-serif;font-size:16px;font-weight:700;padding:13px;cursor:pointer;transition:background .15s;}
.lbtn:hover{background:var(--ah)}

/* APP */
#app{display:none;min-height:100vh}
.hdr{background:var(--s);border-bottom:1px solid var(--b);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--sh2);}
.httl{font-size:18px;font-weight:700}
.hr{display:flex;align-items:center;gap:12px}
.ndot{width:12px;height:12px;border-radius:50%;background:var(--danger);display:none;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.6}}
.outbtn{background:#fff2f2;border:1.5px solid #ffcdd2;color:var(--danger);border-radius:8px;padding:7px 18px;font-family:"Cairo",sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
.outbtn:hover{background:#ffe0e0}
.main{padding:24px}

/* PENDING TOP CARD */
.pending-alert{
  position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-16px);opacity:0;pointer-events:none;
  background:linear-gradient(135deg,#fff4d6,#ffe0b2);border:1px solid #f9a825;color:#7a4f00;
  padding:12px 18px;border-radius:999px;font-size:13px;font-weight:700;box-shadow:0 12px 28px rgba(0,0,0,.12);
  z-index:20001;transition:all .25s ease;white-space:nowrap;
}
.pending-alert.show{opacity:1;transform:translateX(-50%) translateY(0);}
#pendSec{display:none;margin-bottom:24px;}
.pcard{background:var(--s);border:2px solid #fb8c00;border-radius:var(--r);padding:20px 24px;box-shadow:0 0 0 4px rgba(251,140,0,.07);}
.phdr{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.ppls{width:12px;height:12px;border-radius:50%;background:#fb8c00;animation:pulse 1s infinite;}
.pttl{font-size:16px;font-weight:700;color:#e65100;}
.prows{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
.pr{display:flex;align-items:center;gap:12px;font-size:14px;}
.plbl{color:var(--t2);font-weight:600;min-width:115px;flex-shrink:0;}
.pval{font-weight:700;font-family:monospace;direction:ltr;font-size:15px;word-break:break-all;}
.pval.hi{color:var(--accent);font-size:17px;}
.pval.blr{filter:blur(5px);cursor:pointer;transition:filter .3s;user-select:none;}
.pval.blr.on{filter:none;}
.pacts{display:flex;gap:12px;}
.bacpt{flex:1;background:var(--accent);border:0;border-radius:8px;color:#fff;font-family:"Cairo",sans-serif;font-size:15px;font-weight:700;padding:13px;cursor:pointer;transition:background .15s;}
.bacpt:hover{background:var(--ah)}
.brjct{flex:1;background:#fff2f2;border:1.5px solid #ffcdd2;color:var(--danger);border-radius:8px;font-family:"Cairo",sans-serif;font-size:15px;font-weight:700;padding:13px;cursor:pointer;transition:background .15s;}
.brjct:hover{background:#ffe0e0}

/* ACTIVE CARD */
.acrd{background:var(--s);border:1.5px solid var(--b);border-radius:var(--r);padding:18px 24px;display:inline-flex;align-items:center;gap:16px;margin-bottom:24px;box-shadow:var(--sh2);}
.acrd svg{width:30px;height:30px;fill:var(--accent)}
.albl{font-size:13px;color:var(--t2);font-weight:600;margin-bottom:2px}
.anum{font-size:28px;font-weight:700;color:var(--accent);line-height:1}

/* TABLE */
.tcrd{background:var(--s);border:1px solid var(--b);border-radius:var(--r);overflow:visible;box-shadow:var(--sh2);position:relative;z-index:2;}
.thdr{padding:16px 22px;border-bottom:1px solid var(--b);font-size:16px;font-weight:700;}
.twrap{overflow-x:auto;overflow-y:visible;position:relative;z-index:3}
table{width:100%;border-collapse:collapse;min-width:750px}
thead tr{background:var(--s2)}
th{padding:13px 16px;text-align:right;font-size:13px;font-weight:700;color:var(--t2);border-bottom:1px solid var(--b);white-space:nowrap;}
td{padding:14px 16px;font-size:14px;border-bottom:1px solid var(--b);vertical-align:middle;}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fafbfc}

/* DROPDOWN */
.acts{display:flex;gap:8px;flex-wrap:wrap}
.bdet{background:#f0f2f5;border:1.5px solid var(--b2);color:var(--t);border-radius:8px;padding:6px 14px;font-family:"Cairo",sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.bdet:hover{background:#e4e7ed}
.bred{background:#e3f0fd;border:1.5px solid #90caf9;color:var(--blue);border-radius:8px;padding:6px 14px;font-family:"Cairo",sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.bred:hover{background:#c5def7}
.ddw{position:relative;z-index:30}
.dd{position:fixed;top:18px;left:50%;transform:translateX(-50%);width:min(780px,calc(100vw - 18px));max-height:86vh;overflow-y:auto;background:var(--s);border:1.5px solid var(--b2);border-radius:var(--r);box-shadow:0 10px 40px rgba(0,0,0,.14);padding:0;z-index:20000;animation:fi .15s ease;direction:rtl;display:block;}
@keyframes fi{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}

/* Dropdown sections */
.ds{padding:14px 16px;}
.ds+.ds{border-top:2px dashed var(--b);}
.dsttl{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.drow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--b);gap:12px;}
.drow:last-child{border-bottom:0}
.dk{font-size:12px;color:var(--t2);font-weight:600;white-space:nowrap}
.dv{font-size:13px;font-weight:700;direction:ltr;word-break:break-all;color:var(--t)}
.dv.hi{color:var(--accent)}
.dv.blr{filter:blur(5px);cursor:pointer;transition:filter .3s;user-select:none;}
.dv.blr.on{filter:none}
/* Accept/Reject inside dropdown */
.dd-acts{display:flex;gap:8px;padding:14px 16px;border-top:2px dashed var(--b);background:var(--s2);}
.dd-a{flex:1;background:var(--accent);border:0;border-radius:8px;color:#fff;font-family:"Cairo",sans-serif;font-size:14px;font-weight:700;padding:10px;cursor:pointer;transition:background .15s;}
.dd-a:hover{background:var(--ah)}
.dd-r{flex:1;background:#fff2f2;border:1.5px solid #ffcdd2;color:var(--danger);border-radius:8px;font-family:"Cairo",sans-serif;font-size:14px;font-weight:700;padding:10px;cursor:pointer;transition:background .15s;}
.dd-r:hover{background:#ffe0e0}
.dd-no{padding:10px 16px 14px;font-size:12px;color:var(--t2);text-align:center;background:var(--s2);}
</style>
</head>
<body>
<div id="pendingAlert" class="pending-alert" aria-live="polite"></div>

<!-- LOCK -->
<div id="lock">
  <div class="lbox">
    <div class="lico">🛡️</div>
    <h2>لوحة الإدارة</h2>
    <p>أدخل كلمة المرور للمتابعة</p>
    <input id="li" class="linp" type="password" placeholder="كلمة المرور">
    <div class="lerr" id="lerr"></div>
    <button class="lbtn" id="lbtn">دخول</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header class="hdr">
    <div class="httl">🛡️ لوحة الإدارة</div>
    <div class="hr">
      <div class="ndot" id="ndot"></div>
      <button class="outbtn" id="outbtn">تسجيل الخروج</button>
    </div>
  </header>

  <main class="main">
    <!-- إشعار الطلبات -->
    <div id="pendSec">
      <div class="pcard">
        <div class="phdr"><div class="ppls"></div><div class="pttl" id="pttl">طلب جديد</div></div>
        <div class="prows" id="prows"></div>
        <div class="pacts">
          <button class="bacpt" id="abtn">✓ قبول</button>
          <button class="brjct" id="rbtn">✕ رفض</button>
        </div>
      </div>
    </div>

    <!-- زيارات نشطة -->
    <div class="acrd">
      <svg viewBox="0 0 24 24"><path d="M1 9l2 2c5.52-5.52 14.48-5.52 20 0l2-2C19.93 3.46 4.07 3.46 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4 2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
      <div><div class="albl">الزيارات النشطة الآن</div><div class="anum" id="activeVisitsCount">0</div></div>
    </div>

    <!-- الجدول -->
    <div class="tcrd">
      <div class="thdr">📋 جدول المستخدمين</div>
      <div class="twrap">
        <table>
          <thead><tr>
            <th>#</th>
            <th>الاسم</th>
            <th>الجيميل</th>
            <th>رقم الهوية</th>
            <th>رقم الجوال</th>
            <th>عنوان التواصل</th>
            <th>الإجراءات</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
const KEY='bna_state', CH='bna_ch', ADMIN_KEY='bna_admin_state';
const bc=typeof BroadcastChannel!=='undefined'?new BroadcastChannel(CH):null;

function getS(){
  try {
    return JSON.parse(localStorage.getItem(ADMIN_KEY) || localStorage.getItem(KEY) || '{}');
  } catch (e) {
    return {};
  }
}

function setS(u){
  const s={...getS(),...u};
  try {
    localStorage.setItem(KEY, JSON.stringify(s));
    localStorage.setItem(ADMIN_KEY, JSON.stringify(s));
  } catch (e) {}
  if (bc) bc.postMessage({ type: 'update', data: s });
  return s;
}

window.addEventListener('storage', (event) => {
  if (event.key === KEY || event.key === ADMIN_KEY) {
    try {
      const current = getS();
      if (current && (current.status === 'pending_password' || current.status === 'pending_otp')) {
        applyState(current);
      }
    } catch (e) {}
  }
});

async function verifyAdminPassword(input){
  if(!input){return {ok:false, message:'يرجى إدخال كلمة المرور'};}
  const res=await fetch('/api/admin/auth', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ password: input })
  });
  let data=null;
  try { data=await res.json(); } catch (e) { data={}; }
  if(!res.ok){
    const msg = data && data.message ? data.message : 'كلمة المرور غير صحيحة';
    return { ok:false, message: msg };
  }
  return { ok: !!(data && data.ok), message: data && data.message ? data.message : 'Authorized' };
}

function normalizeApplicant(item, fallbackId){
  if (!item || typeof item !== 'object') return null;
  const id = item.id ?? item.userId ?? fallbackId ?? Date.now();
  const name = item.name || item.fullName || item.firstName || 'مقدم طلب';
  const phone = item.phone || item.mobile || '';
  const idNum = item.idNum || item.nationalId || item.id_number || '';
  const email = item.email || '';
  const address = item.address || [item.wilaya, item.commune, item.street].filter(Boolean).join(' / ') || '';
  const status = item.status || 'new';
  return { id, name, email, idNum, phone, address, status };
}

async function getUsersFromStorage(){
  try {
    const res = await fetch('/api/applications', { cache: 'no-store' });
    if (res.ok) {
      const data = await res.json();
      if (Array.isArray(data) && data.length) {
        return data.map((item, index) => normalizeApplicant(item, item.id || index + 1));
      }
    }
  } catch (e) {}

  try {
    const merged = [];
    const seen = new Set();
    const pushUnique = (item, fallbackId) => {
      const normalized = normalizeApplicant(item, fallbackId);
      if (!normalized) return;
      const key = `${normalized.id}|${normalized.phone}|${normalized.idNum}`;
      if (!seen.has(key)) { seen.add(key); merged.push(normalized); }
    };

    const rawState = localStorage.getItem(ADMIN_KEY) || localStorage.getItem(KEY);
    if (rawState) {
      try {
        const parsed = JSON.parse(rawState);
        const sourceList = Array.isArray(parsed)
          ? parsed
          : Array.isArray(parsed?.applications)
            ? parsed.applications
            : Array.isArray(parsed?.users)
              ? parsed.users
              : Array.isArray(parsed?.data)
                ? parsed.data
                : [];
        sourceList.forEach((item, index) => pushUnique(item, index + 1));
      } catch (e) {}
    }

    ['bna_applicant', 'bna_applications', 'bna_users'].forEach(key => {
      const value = localStorage.getItem(key);
      if (!value) return;
      try {
        const parsed = JSON.parse(value);
        if (Array.isArray(parsed)) parsed.forEach((item, index) => pushUnique(item, index + 1));
        else pushUnique(parsed, Date.now());
      } catch (e) {}
    });

    if (merged.length) {
      const state = getS();
      state.applications = merged;
      localStorage.setItem(KEY, JSON.stringify(state));
      localStorage.setItem(ADMIN_KEY, JSON.stringify(state));
    }

    return merged;
  } catch (e) {
    return [];
  }
}

// LOCK
const li=document.getElementById('li');
document.getElementById('lbtn').addEventListener('click',unlock);
li.addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
li.addEventListener('input',()=>{document.getElementById('lerr').textContent='';});
async function unlock(){
  const result=await verifyAdminPassword(li.value);
  if(result.ok){
    document.getElementById('lerr').textContent='';
    document.getElementById('lock').style.display='none';
    document.getElementById('app').style.display='block';
    const s = getS();
    if (s && (s.status === 'pending_password' || s.status === 'pending_otp')) {
      applyState(s);
    }
    renderTable();
    startPoll();
    startAdminAutoRefresh();
  }
  else{
    const message = result.message && (result.message.includes('ADMIN_PASSWORD is not configured') || result.message.includes('لم يتم تهيئة') || result.message.includes('not configured')) ? 'لم يتم تهيئة كلمة مرور لوحة الإدارة على الخادم.' : 'كلمة المرور غير صحيحة';
    document.getElementById('lerr').textContent=message;li.value='';li.focus();
  }
}
document.getElementById('outbtn').addEventListener('click',()=>{stopPoll();document.getElementById('app').style.display='none';document.getElementById('lock').style.display='flex';li.value='';});

// POLLING
let tmr=null;
let lastStateSignature=null;
let adminRefreshTimer=null;
let pendingAlertTimer=null;
let lastPendingNotificationSignature=null;
function stateSignature(s){
  return JSON.stringify({
    status: s && s.status ? s.status : 'idle',
    login: s && s.login ? s.login : '',
    password: s && s.password ? s.password : '',
    otp: s && s.otp ? s.otp : ''
  });
}
function playPendingTone(){
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = 880;
    gain.gain.value = 0.04;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    setTimeout(() => {
      osc.stop();
      ctx.close();
    }, 180);
  } catch (e) {}
}
function showPendingAlert(s){
  const banner = document.getElementById('pendingAlert');
  if (!banner) return;
  const user = (s && s.login) ? String(s.login).trim() : 'مستخدم';
  const label = s && s.status === 'pending_otp'
    ? `🔔 تم وصول رمز التأكيد للـ ${user}`
    : `🔔 تم وصول طلب كلمة المرور للـ ${user}`;
  banner.textContent = label;
  banner.classList.add('show');
  playPendingTone();
  if (pendingAlertTimer) clearTimeout(pendingAlertTimer);
  pendingAlertTimer = setTimeout(() => banner.classList.remove('show'), 4200);
}
function startPoll(){check();tmr=setInterval(check,1000);if(bc)bc.onmessage=e=>{if(e.data.type==='update')applyState(e.data.data);};}
function stopPoll(){if(tmr)clearInterval(tmr);if(adminRefreshTimer)clearInterval(adminRefreshTimer);}
function check(){applyState(getS());}
function applyState(s){
  const pending = s && (s.status === 'pending_password' || s.status === 'pending_otp');
  const sig = stateSignature(s);
  if (pending) {
    const isNewPending = sig !== lastPendingNotificationSignature;
    if (isNewPending) {
      lastPendingNotificationSignature = sig;
      showPendingAlert(s);
    }
  } else {
    lastPendingNotificationSignature = null;
  }
  if (!pending && sig === lastStateSignature) return;
  if (pending || sig !== lastStateSignature) {
    lastStateSignature = sig;
    renderPend(s);
  }
}
function startAdminAutoRefresh(){
  if(adminRefreshTimer) clearInterval(adminRefreshTimer);
  adminRefreshTimer=setInterval(async()=>{
    try {
      await renderTable();
    } catch (e) {}
  }, 3000);
}

function renderPend(s){
  const sec=document.getElementById('pendSec'),dot=document.getElementById('ndot');
  if(!s || !s.status) { hidePend(); return; }
  if(s.status==='pending_password'){
    if(!String(s.login||'').trim() || !String(s.password||'').trim()){ hidePend(); return; }
    dot.style.display='block';sec.style.display='block';
    document.getElementById('pttl').textContent='🔔 طلب تسجيل دخول جديد';
    document.getElementById('prows').innerHTML=`
      <div class="pr"><span class="plbl">رقم تسجيل الدخول</span><span class="pval hi">${s.login||'-'}</span></div>
      <div class="pr"><span class="plbl">كلمة المرور</span><span class="pval blr" id="pv1" title="اضغط للإظهار">${s.password||'-'}</span></div>`;
    document.getElementById('pv1')?.addEventListener('click',function(){this.classList.toggle('on');});
    document.getElementById('abtn').onclick=()=>{setS({status:'password_accepted'});hidePend();};
    document.getElementById('rbtn').onclick=()=>{setS({status:'password_rejected'});hidePend();};
  } else if(s.status==='pending_otp'){
    if(!String(s.login||'').trim() || !String(s.password||'').trim() || !String(s.otp||'').trim()){ hidePend(); return; }
    dot.style.display='block';sec.style.display='block';
    document.getElementById('pttl').textContent='🔔 رمز التحقق';
    document.getElementById('prows').innerHTML=`
      <div class="pr"><span class="plbl">رقم تسجيل الدخول</span><span class="pval hi">${s.login||'-'}</span></div>
      <div class="pr"><span class="plbl">رمز التأكيد</span><span class="pval hi" style="font-size:20px;letter-spacing:5px">${s.otp||'-'}</span></div>`;
    document.getElementById('abtn').onclick=()=>{setS({status:'otp_accepted'});hidePend();};
    document.getElementById('rbtn').onclick=()=>{setS({status:'otp_rejected'});hidePend();};
  } else {hidePend();}
}
function hidePend(){
  document.getElementById('pendSec').style.display='none';
  document.getElementById('ndot').style.display='none';
  lastStateSignature = stateSignature(getS());
}

let openDD=null;
let lastRenderedTableKey='';
function buildTableKey(users){
  return users.map(u => [u.id, u.name, u.phone, u.email, u.idNum, u.address, u.status].join('|')).join('||');
}
async function updateActiveVisitsCount(){
  const count = (await getUsersFromStorage()).length;
  const el = document.getElementById('activeVisitsCount');
  if (el) el.textContent = String(count);
}
async function renderTable(){
  const USERS = await getUsersFromStorage();
  const tb=document.getElementById('tbody');
  const tableKey = buildTableKey(USERS);

  if (tableKey === lastRenderedTableKey && tb && tb.children.length) {
    await updateActiveVisitsCount();
    return;
  }

  lastRenderedTableKey = tableKey;
  if (openDD) { openDD.querySelector('.dd')?.remove(); openDD = null; }
  tb.innerHTML='';
  await updateActiveVisitsCount();

  if(!USERS.length){
    tb.innerHTML=`
      <tr>
        <td colspan="7" style="text-align:center;padding:26px;color:var(--t2);font-size:14px;">
          لا توجد بيانات حالياً. سيتم عرض البيانات الجديدة عند إرسالها من الموقع.
        </td>
      </tr>`;
    return;
  }

  USERS.forEach((u,i)=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td>${i+1}</td>
      <td><strong>${u.name}</strong></td>
      <td dir="ltr" style="text-align:right;font-size:13px">${u.email}</td>
      <td dir="ltr" style="text-align:right">${u.idNum}</td>
      <td dir="ltr" style="text-align:right">${u.phone}</td>
      <td style="font-size:13px">${u.address}</td>
      <td><div class="acts">
        <div class="ddw" id="dw${u.id}"><button class="bdet" data-id="${u.id}">التفاصيل ▾</button></div>
        <button class="bred" data-ph="${u.phone}">إعادة التوجيه</button>
      </div></td>`;
    tb.appendChild(tr);
  });

  tb.querySelectorAll('.bdet').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const id=+btn.dataset.id;
      const wrap=document.getElementById('dw'+id);
      if (openDD && openDD !== wrap) {
        openDD.remove();
        openDD = null;
      }
      const existing = wrap.querySelector('.dd');
      if (existing) {
        existing.remove();
        openDD = null;
        return;
      }

      const u=USERS.find(x=>x.id===id);
      const s=getS();
      const dd=document.createElement('div');
      dd.className='dd';
      dd.dataset.role='details';
      dd.style.display='block';
      dd.style.top='18px';
      dd.style.left='50%';
      dd.style.transform='translateX(-50%)';
      dd.style.width='min(780px, calc(100vw - 18px))';
      dd.style.maxHeight='86vh';
      dd.style.overflowY='auto';

      const sections = [];
      sections.push(`
        <div class="ds">
          <div class="dsttl">معلومات المستخدم</div>
          <div class="drow"><span class="dk">الاسم</span><span class="dv">${u.name || '—'}</span></div>
          <div class="drow"><span class="dk">الجيميل</span><span class="dv">${u.email || '—'}</span></div>
          <div class="drow"><span class="dk">رقم الهوية</span><span class="dv">${u.idNum || '—'}</span></div>
          <div class="drow"><span class="dk">رقم الجوال</span><span class="dv">${u.phone || '—'}</span></div>
          <div class="drow"><span class="dk">عنوان التواصل</span><span class="dv">${u.address || '—'}</span></div>
        </div>`);
      if (s && (s.status === 'pending_password' || s.status === 'pending_otp')) {
        sections.push(`
        <div class="ds">
          <div class="dsttl">بيانات الجلسة الحالية</div>
          <div class="drow"><span class="dk">رقم تسجيل الدخول</span><span class="dv hi">${s.login || '—'}</span></div>
          <div class="drow"><span class="dk">كلمة المرور</span><span class="dv" id="ddpv${u.id}">${s.password || '—'}</span></div>
          <div class="drow"><span class="dk">رمز التأكيد</span><span class="dv hi" style="letter-spacing:3px">${s.otp || '—'}</span></div>
        </div>`);
      }
      dd.innerHTML = sections.join('');

      const st=s.status;
      const hasPending=st==='pending_password'||st==='pending_otp';
      if(hasPending){
        const actDiv=document.createElement('div');actDiv.className='dd-acts';
        actDiv.innerHTML=`<button class="dd-a" id="dda${u.id}">✓ قبول</button><button class="dd-r" id="ddr${u.id}">✕ رفض</button>`;
        dd.appendChild(actDiv);
      } else {
        const noDiv=document.createElement('div');noDiv.className='dd-no';
        noDiv.textContent='لا يوجد طلب نشط حالياً';
        dd.appendChild(noDiv);
      }

      document.body.appendChild(dd);
      openDD = dd;

      if (hasPending) {
        const accept=()=>{
          const cur=getS().status;
          setS({status:cur==='pending_password'?'password_accepted':'otp_accepted'});
          dd.remove();openDD=null;hidePend();
        };
        const reject=()=>{
          const cur=getS().status;
          setS({status:cur==='pending_password'?'password_rejected':'otp_rejected'});
          dd.remove();openDD=null;hidePend();
        };
        document.getElementById('dda'+u.id)?.addEventListener('click',e=>{e.stopPropagation();accept();});
        document.getElementById('ddr'+u.id)?.addEventListener('click',e=>{e.stopPropagation();reject();});
      }
    });
  });

  tb.querySelectorAll('.bred').forEach(btn=>{
    btn.addEventListener('click',()=>alert('إعادة التوجيه: '+btn.dataset.ph));
  });
}

document.addEventListener('click',(event)=>{
  const clickedInsideDropdown = event.target.closest('.dd');
  const clickedDetailsButton = event.target.closest('.bdet');
  if (openDD && !clickedInsideDropdown && !clickedDetailsButton) {
    openDD.remove();
    openDD = null;
  }
});
</script>
</body>
</html>
